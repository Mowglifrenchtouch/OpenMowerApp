name: Build and Push OpenMowerApp (Flutter Web + Multi-Arch) to GHCR

on:
  push:
    branches:
      - lib-updatefull
    tags:
      - 'v*' # Ex: v1.0.1

jobs:
  build-and-push:
    name: Build Flutter Web and Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.22.1 (Dart 3.8.x)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.1'
          channel: stable
          cache: false

      - name: Check Flutter & Dart versions
        run: |
          flutter --version
          dart --version

#      - name: Restore Flutter cache
#        uses: actions/cache@v4
#        with:
#          path: |
#            ~/.pub-cache
#            .dart_tool
#            build
#          key: flutter-cache-${{ hashFiles('pubspec.lock') }}
#          restore-keys: |
#            flutter-cache-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Build Flutter Web (release)
        run: flutter build web --release --dart-define=FLUTTER_WEB_CANVASKIT_URL=/canvaskit/

      - name: Confirm build/web exists
        run: ls -lh build/web/index.html

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Docker buildx cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mowglifrenchtouch/openmowerapp:lib-updatefull
            ghcr.io/mowglifrenchtouch/openmowerapp:latest
            ghcr.io/mowglifrenchtouch/openmowerapp:${{ github.ref_type == 'tag' && github.ref_name || '' }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: Move Docker buildx cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

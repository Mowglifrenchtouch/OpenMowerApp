name: Build and Push OpenMowerApp (Flutter Web + Multi-Arch) to GHCR

on:
  push:
    branches:
      - lib-updatefull
    tags:
      - 'v*' # Ex: v1.0.1

jobs:
  build-and-push:
    name: Build Flutter Web and Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter 3.22.1 (Dart 3.8.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.1'
          channel: stable
          cache: false

      - name: Check Flutter & Dart versions (fail if incorrect)
        run: |
          flutter --version
          dart --version
          DART_VERSION=$(dart --version 2>&1 | grep -oP '\d+\.\d+\.\d+')
          echo "Dart version detected: $DART_VERSION"
          if [[ "$DART_VERSION" != "3.8.1" ]]; then
            echo "❌ Dart 3.8.1 is required but found $DART_VERSION"
            exit 1
          fi

      - name: Restore Flutter cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            build
          key: flutter-cache-dart3.8-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            flutter-cache-dart3.8-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Build Flutter Web (release)
        run: flutter build web --release --dart-define=FLUTTER_WEB_CANVASKIT_URL=/canvaskit/

      - name: Confirm build/web exists
        run: ls -lh build/web/index.html

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Docker buildx cache (Dart 3.8 specific)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-dart3.8
          key: buildx-dart3.8-${{ github.sha }}
          restore-keys: |
            buildx-dart3.8-

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mowglifrenchtouch/openmowerapp:lib-updatefull
            ghcr.io/mowglifrenchtouch/openmowerapp:latest
            ghcr.io/mowglifrenchtouch/openmowerapp:${{ github.ref_type == 'tag' && github.ref_name || '' }}
          cache-from: type=local,src=/tmp/.buildx-cache-dart3.8
          cache-to: type=local,dest=/tmp/.buildx-cache-dart3.8-new

      - name: Move Docker buildx cache
        run: |
          rm -rf /tmp/.buildx-cache-dart3.8
          mv /tmp/.buildx-cache-dart3.8-new /tmp/.buildx-cache-dart3.8

      - name: Verify Dart SDK version in final Docker image
        run: |
          echo "🔎 Vérification de Dart SDK dans l'image Docker finale..."
          docker run --rm ghcr.io/mowglifrenchtouch/openmowerapp:latest dart --version
